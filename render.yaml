services:
  - type: web
    name: eventsphere-mas
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: eventsphere-db
          property: connectionString

databases:
  - name: eventsphere-db
    databaseName: eventsphere
    user: eventsphere_user