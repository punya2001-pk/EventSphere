{% extends "base.html" %}
{% block content %}
<div class="row g-3 justify-content-center">
  <div class="col-12 col-md-5">
    <div class="card p-3">
      <h5>Sign In</h5>
      <form method="post" action="/auth/login">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="mb-2"><label class="small">Email</label><input type="email" name="email" class="form-control" required></div>
        <div class="mb-3"><label class="small">Password</label><input type="password" name="password" class="form-control" required></div>
        <button class="btn btn-primary w-100">Sign In</button>
      </form>
    </div>
  </div>
  <div class="col-12 col-md-5">
    <div class="card p-3">
      <h5>Register (Attendee)</h5>
      <form method="post" action="/auth/register">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="mb-2"><label class="small">Full Name</label><input type="text" name="name" class="form-control" required></div>
        <div class="mb-2"><label class="small">Email</label><input type="email" name="email" class="form-control" required></div>
        <div class="mb-3"><label class="small">Password</label><input type="password" name="password" minlength="6" class="form-control" required></div>
        <button class="btn btn-success w-100">Create Account</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
